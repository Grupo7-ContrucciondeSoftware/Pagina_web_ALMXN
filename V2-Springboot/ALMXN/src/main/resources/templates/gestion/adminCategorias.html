<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administrar Categorías - Sistema de Gestión de Almacén">
    <title>ALMXN - Administrar Categorías</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/globalGestion.css}">
    <link rel="stylesheet" th:href="@{/css/adminCategorias.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main id="contenido-principal-gestion">

    <input type="radio" name="tab" id="pestaña-listaCategorias" checked style="display:none">

    <div class="centro-pagina-gestion">

        <section class="gestion-inicio">
            <div>
                <h1 class="titulo-seccion">Administrar Categorías</h1>
                <p class="subtitulo-seccion">Gestione las clasificaciones de los productos</p>
            </div>
            <div class="formulario-acciones">
                <a th:href="@{/gestion}" class="btn btn-secundario">Volver</a>
                <a th:href="@{/gestion/adminCategorias/nueva}" class="btn btn-primario">+ Agregar Categoría</a>
            </div>
        </section>

        <div class="pestañas">
            <label for="pestaña-listaCategorias" class="pestaña">Lista de Categorías</label>
        </div>

        <div class="pestaña-contenido" id="contenido-listaCategorias">
            <form method="GET" th:action="@{/gestion/adminCategorias}" class="filtro-container">
                <input type="hidden" name="tab" value="pestaña-listaCategorias">
                <div class="filtro-grupo">
                    <label class="form-label" for="nombre-filtro">Nombre de Categoría: </label>
                    <input class="form-control" type="text" id="nombre-filtro" name="nombre" placeholder="Ej: Abarrotes" th:value="${param.nombre}">
                </div>
                <div class="filtro-grupo">
                    <label class="form-label" for="estado-filtro">Estado:</label>
                    <select id="estado-filtro" name="estado" class="form-control">
                        <option value="Todos" th:selected="${param.estado == null or param.estado[0] == 'Todos'}">Sin filtro</option>
                        <option value="Activo" th:selected="${param.estado != null and param.estado[0] == 'Activo'}">Activo</option>
                        <option value="Inactivo" th:selected="${param.estado != null and param.estado[0] == 'Inactivo'}">Inactivo</option>
                    </select>
                </div>
                <div class="filtro-acciones">
                    <button type="submit" class="btn btn-secundario">Filtrar</button>
                    <a th:href="@{/gestion/adminCategorias(tab='pestaña-listaCategorias')}" class="btn btn-secundario">Limpiar</a>
                </div>
            </form>

            <table class="tabla">
                <thead class="header-tabla">
                <tr>
                    <th class="header-tabla">ID</th>
                    <th class="header-tabla">Nombre</th>
                    <th class="header-tabla">Descripción</th>
                    <th class="header-tabla">Estado</th>
                    <th class="header-tabla">Acciones</th>
                </tr>
                </thead>
                <tbody class="body-tabla">
                <tr th:each="categoria : ${listaCategorias}">
                    <td class="body-tabla" th:text="${categoria.idCategoria}"></td>
                    <td class="body-tabla" th:text="${categoria.nombreCategoria}"></td>
                    <td class="body-tabla" th:text="${categoria.descripcionCategoria}"></td>
                    <td class="body-tabla">
                        <span class="estado" th:classappend="${#strings.toLowerCase(categoria.estadoCategoria)}" th:text="${categoria.estadoCategoria}"></span>
                    </td>
                    <td class="body-tabla">
                        <th:block th:if="${categoria.estadoCategoria == 'Activo'}">
                            <a th:href="@{/gestion/adminCategorias/editar(id=${categoria.idCategoria})}" class="btn btn-secundario btn-editar">Editar</a>
                            <th:block th:if="${session.usuarioLogueado.rol == 'Admin'}">
                                <form th:action="@{/gestion/adminCategorias/eliminar}" method="POST" style="display:inline;">
                                    <input type="hidden" name="idCategoria" th:value="${categoria.idCategoria}">
                                    <button type="submit" class="btn btn-secundario btn-eliminar">Eliminar</button>
                                </form>
                            </th:block>
                            <th:block th:if="${session.usuarioLogueado.rol != 'Admin'}">
                                <label for="toggle-modal-permiso" class="btn btn-secundario btn-falso-eliminar">Eliminar</label>
                            </th:block>
                        </th:block>
                        <th:block th:if="${categoria.estadoCategoria != 'Activo'}">
                            <th:block th:if="${session.usuarioLogueado.rol == 'Admin'}">
                                <form th:action="@{/gestion/adminCategorias/activar}" method="POST">
                                    <input type="hidden" name="idCategoria" th:value="${categoria.idCategoria}">
                                    <button type="submit" class="btn btn-secundario btn-activar">Activar</button>
                                </form>
                            </th:block>
                            <th:block th:if="${session.usuarioLogueado.rol != 'Admin'}">
                                <label for="toggle-modal-permiso" class="btn btn-secundario btn-falso-activar">Activar</label>
                            </th:block>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/modalRestriccion :: modalRestriccion}"></div>
</body>
</html>

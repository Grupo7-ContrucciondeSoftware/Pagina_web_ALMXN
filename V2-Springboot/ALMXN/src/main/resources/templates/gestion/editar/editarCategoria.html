<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editar Categoría - Sistema de Gestión de Almacén">
    <title>ALMXN - Editar Categoría</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/globalGestion.css}">
    <link rel="stylesheet" th:href="@{/css/adminCategoria.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main id="contenido-principal-gestion">
        <div class="centro-pagina-gestion">
            <section class="gestion-inicio">
                <div>
                    <h1 class="titulo-seccion">Editar Categoria</h1>
                    <p class="subtitulo-seccion">Modificando los datos de la categoria: <span th:text="${categoria.idCategoria}"></span></p>
                </div>
                <div class="formulario-acciones">
                    <a th:href="@{/gestion/adminCategorias}" class="btn btn-secundario">Cancelar y Volver</a>
                </div>
            </section>
            <div class="pestaña-contenido" style="display: block;">
                <section class="form-grupo">
                    <form th:action="@{/gestion/adminCategorias/guardar}" method="POST" th:object="${categoria}">
                        <input type="hidden" th:field="*{idCategoria}">
                        <div class="formulario">
                            <div class="form-grupo">
                                <label for="categoria-nombre" class="form-label">Nombre</label>
                                <input type="text" id="categoria-nombre" th:field="*{nombreCategoria}" class="form-control">
                            </div>
                        </div>
                        <div class="form-grupo form-textarea">
                            <label for="descripcionCategoria" class="form-label">Descripción <span class="formulario-opcional">(opcional)</span></label>
                            <textarea id="descripcionCategoria" th:field="*{descripcionCategoria}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="formulario-acciones">
                            <button type="submit" class="btn btn-primario">Guardar Cambios</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

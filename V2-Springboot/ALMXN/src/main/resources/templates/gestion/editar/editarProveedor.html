<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editar Proveedor - Sistema de Gestión de Almacén">
    <title>ALMXN - Editar Proveedor</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/globalGestion.css}">
    <link rel="stylesheet" th:href="@{/css/adminProveedores.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main id="contenido-principal-gestion">
        <div class="centro-pagina-gestion">
            <section class="gestion-inicio">
                <div>
                    <h1 class="titulo-seccion">Editar Proveedores</h1>
                    <p class="subtitulo-seccion">Modificando los datos del Proveedor con ID: <span th:text="${proveedor.idProveedor}"></span></p>
                </div>
                <div class="formulario-acciones">
                    <a th:href="@{/gestion/adminProveedores}" class="btn btn-secundario">Cancelar y Volver</a>
                </div>
            </section>
            <div class="pestaña-contenido" style="display: block;">
                <section class="form-grupo">
                    <form th:action="@{/gestion/adminProveedores/guardar}" method="POST" th:object="${proveedor}">
                        <input type="hidden" th:field="*{idProveedor}">
                        <div class="formulario">
                            <div class="form-grupo">
                                <label for="ruc-proveedor" class="form-label">RUC</label>
                                <input type="number" id="ruc-proveedor" th:field="*{rucProveedor}" class="form-control" placeholder="Ej: 20123456789" maxlength="11" required>
                            </div>
                            <div class="form-grupo">
                                <label for="razonsocial-proveedor" class="form-label">Razon Social</label>
                                <input type="text" id="razonsocial-proveedor" th:field="*{razonSocialProveedor}" class="form-control" required>
                            </div>
                            <div class="form-grupo">
                                <label for="telefono-proveedor" class="form-label">Teléfono</label>
                                <input type="number" id="telefono-proveedor" th:field="*{telefonoProveedor}" class="form-control" placeholder="Ej: 987654321" maxlength="9">
                            </div>
                            <div class="form-grupo">
                                <label for="email-proveedor" class="form-label">Correo Electrónico</label>
                                <input type="text" id="email-proveedor" th:field="*{correoProveedor}" class="form-control">
                            </div>
                        </div>
                        <div class="formulario-acciones">
                            <button type="submit" class="btn btn-primario">Guardar Cambios</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/tema.js}" defer></script>
</body>
</html>

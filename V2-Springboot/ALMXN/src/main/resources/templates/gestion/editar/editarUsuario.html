<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editar Usuario - Sistema de Gestión de Almacén">
    <title>ALMXN - Editar Usuario</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/globalGestion.css}">
    <link rel="stylesheet" th:href="@{/css/adminUsuarios.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main id="contenido-principal-gestion">
        <div class="centro-pagina-gestion">
            <section class="gestion-inicio">
                <div>
                    <h1 class="titulo-seccion">Editar Usuario</h1>
                    <p class="subtitulo-seccion">Modificando los datos de: <span th:text="${usuario.nombres} + ' ' + ${usuario.apellidos}"></span></p>
                </div>
                <div class="formulario-acciones">
                    <a th:href="@{/gestion/adminUsuarios}" class="btn btn-secundario">Cancelar y Volver</a>
                </div>
            </section>
            <div class="pestaña-contenido" style="display: block;">
                <section class="form-grupo">
                    <form th:action="@{/gestion/adminUsuarios/guardar}" method="POST" th:object="${usuario}" class="form-validable">
                        <input type="hidden" th:field="*{idUsuario}">
                        <div class="formulario">
                            <div class="form-grupo">
                                <label for="nombres-usuario" class="form-label">Nombres</label>
                                <input type="text" id="nombres-usuario" th:field="*{nombres}" class="form-control" required>
                            </div>
                            <div class="form-grupo">
                                <label for="apellidos-usuario" class="form-label">Apellidos</label>
                                <input type="text" id="apellidos-usuario" th:field="*{apellidos}" class="form-control" required>
                            </div>
                            <div class="form-grupo">
                                <label for="email-usuario" class="form-label">Correo Electrónico</label>
                                <input type="email" id="email-usuario" th:field="*{correo}" class="form-control" required>
                            </div>
                            <div class="form-grupo">
                                <label for="rol-usuario" class="form-label">Rol del Sistema</label>
                                <select id="rol-usuario" th:field="*{rol}" class="form-control" required>
                                    <option value="" disabled>Seleccione un rol</option>
                                    <option value="Admin">Administrador</option>
                                    <option value="Usuario">Usuario</option>
                                </select>
                            </div>
                        </div>
                        <div class="formulario-acciones">
                            <button type="submit" class="btn btn-primario">Guardar Cambios</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

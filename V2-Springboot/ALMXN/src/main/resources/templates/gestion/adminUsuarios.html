<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administrar Usuario - Sistema de Gestión de Almacén">
    <title>ALMXN - Administrar Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/globalGestion.css}">
    <link rel="stylesheet" th:href="@{/css/adminUsuarios.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main id="contenido-principal-gestion">

    <input type="radio" name="tab" id="pestaña-listaUsuario" checked style="display:none">

    <div class="centro-pagina-gestion">

        <section class="gestion-inicio">
            <div>
                <h1 class="titulo-seccion">Administrar Usuarios</h1>
                <p class="subtitulo-seccion">Gestione los usuarios del sistema</p>
            </div>
            <div class="formulario-acciones">
                <a th:href="@{/gestion}" class="btn btn-secundario">Volver</a>
                <a th:href="@{/gestion/adminUsuarios/nueva}" class="btn btn-primario">+ Agregar Usuario</a>
            </div>
        </section>

        <div class="pestañas">
            <label for="pestaña-listaUsuario" class="pestaña">Lista de Usuarios</label>
        </div>

        <div class="pestaña-contenido" id="contenido-listaUsuario">
            <form method="GET" th:action="@{/gestion/adminUsuarios}" class="filtro-container">
                <input type="hidden" name="tab" value="pestaña-listaUsuario">
                <div class="filtro-grupo">
                    <label class="form-label" for="nombre-filtro">Nombre: </label>
                    <input class="form-control" type="text" id="nombre-filtro" name="nombre" placeholder="Ingrese nombre" th:value="${param.nombre}">
                </div>
                <div class="filtro-grupo">
                    <label class="form-label" for="rol-filtro">Rol:</label>
                    <select class="form-control" id="rol-filtro" name="rol">
                        <option value="" th:selected="${param.rol == null or param.rol[0] == ''}">Sin Filtro</option>
                        <option value="Admin" th:selected="${param.rol != null and param.rol[0] == 'Admin'}">Administrador</option>
                        <option value="Usuario" th:selected="${param.rol != null and param.rol[0] == 'Usuario'}">Usuario</option>
                    </select>
                </div>
                <div class="filtro-grupo">
                    <label class="form-label" for="estado-filtro">Estado:</label>
                    <select class="form-control" id="estado-filtro" name="estado">
                        <option value="Todos" th:selected="${param.estado == null or param.estado[0] == 'Todos'}">Sin Filtro</option>
                        <option value="Activo" th:selected="${param.estado != null and param.estado[0] == 'Activo'}">Activo</option>
                        <option value="Inactivo" th:selected="${param.estado != null and param.estado[0] == 'Inactivo'}">Inactivo</option>
                    </select>
                </div>
                <div class="filtro-grupo">
                    <label class="form-label" for="fecha-filtro">Fecha: </label>
                    <input class="form-control" type="date" id="fecha-filtro" name="fecha" th:value="${param.fecha}">
                </div>
        </div>
        <div class="filtro-acciones">
            <button type="submit" class="btn btn-secundario">Filtrar</button>
            <a th:href="@{/gestion/adminUsuarios(tab='pestaña-listaUsuario')}" class="btn btn-secundario">Limpiar</a>
        </div>
        </form>

        <table class="tabla">
            <thead class="header-tabla">
            <tr>
                <th class="header-tabla">ID</th>
                <th class="header-tabla">Nombre</th>
                <th class="header-tabla">Correo</th>
                <th class="header-tabla">Fecha Creación</th>
                <th class="header-tabla">Rol</th>
                <th class="header-tabla">Estado</th>
                <th class="header-tabla">Acciones</th>
            </tr>
            </thead>
            <tbody class="body-tabla">
            <tr th:each="usuario : ${listaUsuarios}">
                <td class="body-tabla" th:text="${usuario.idUsuario}"></td>
                <td class="body-tabla" th:text="${usuario.nombres} + ' ' + ${usuario.apellidos}"></td>
                <td class="body-tabla" th:text="${usuario.correo}"></td>
                <td class="body-tabla" th:text="${usuario.fechaCreacion}"></td>
                <td class="body-tabla">
                    <span class="rol" th:classappend="'rol-' + ${#strings.toLowerCase(usuario.rol)}" th:text="${usuario.rol}"></span>
                </td>
                <td class="body-tabla">
                    <span class="estado" th:classappend="${#strings.toLowerCase(usuario.estadoUsuario)}" th:text="${usuario.estadoUsuario}"></span>
                </td>
                <td class="body-tabla">
                    <th:block th:if="${usuario.estadoUsuario == 'Activo'}">
                        <a th:if="${session.usuarioLogueado.rol == 'Admin'}"
                           th:href="@{/gestion/adminUsuarios/editar(id=${usuario.idUsuario})}"
                           class="btn btn-secundario btn-editar">Editar</a>
                        <label th:if="${session.usuarioLogueado.rol != 'Admin'}" for="toggle-modal-permiso" class="btn btn-secundario" style="font-size: 16px;">Editar</label>
                        <th:block th:if="${session.usuarioLogueado.rol == 'Admin'}">
                            <button th:if="${usuario.idUsuario == session.usuarioLogueado.idUsuario}" type="button" class="btn btn-secundario btn-eliminar" disabled style="opacity: 0.5; cursor: not-allowed;" title="No puedes eliminar tu propia cuenta">Eliminar</button>
                            <form th:if="${usuario.idUsuario != session.usuarioLogueado.idUsuario}" th:action="@{/gestion/adminUsuarios/eliminar}" method="POST" style="display:inline;">
                                <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}">
                                <button type="submit" class="btn btn-secundario btn-eliminar">Eliminar</button>
                            </form>
                        </th:block>
                        <label th:if="${session.usuarioLogueado.rol != 'Admin'}" for="toggle-modal-permiso" class="btn btn-secundario btn-falso-eliminar">Eliminar</label>
                    </th:block>
                    <th:block th:if="${usuario.estadoUsuario != 'Activo'}">
                        <form th:if="${session.usuarioLogueado.rol == 'Admin'}" th:action="@{/gestion/adminUsuarios/activar}" method="POST">
                            <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}">
                            <button type="submit" class="btn btn-secundario btn-activar">Activar</button>
                        </form>
                        <label th:if="${session.usuarioLogueado.rol != 'Admin'}" for="toggle-modal-permiso" class="btn btn-secundario btn-falso-activar">Activar</label>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/modalRestriccion :: modalRestriccion}"></div>
</body>
</html>
